name: web

# Builds the Astro site under web/ and checks the artifact. Build only: nothing is deployed from
# here, and the workflow cannot write to the repository or to GitHub Pages.
on:
  push:
    branches: [main, astro-migration]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (the artifact tests read room_census.py constants)
        run: python -m pip install -r requirements.txt
      - name: Install from the lockfile (install scripts are off in web/.npmrc)
        working-directory: web
        run: npm ci
      - name: Staging and data tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: A second build gives the same bytes
        working-directory: web
        run: |
          cp -r dist "$RUNNER_TEMP/first"
          npm run build
          diff -r "$RUNNER_TEMP/first" dist
      - name: Artifact tests
        run: python -m unittest tests.test_web -v
      - name: Artifact tests under python -O
        run: python -O -m unittest tests.test_web
      - name: Route and artifact contract
        run: python tests/site_contract.py web/dist
      - name: Keep the built site for review
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
