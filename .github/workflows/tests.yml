name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile room_census.py census_render.py flop_did.py durable.py manifest.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the staging tests run by the Python suite import the site's schema, which needs web/node_modules
      - name: Install the site's dependencies from the lockfile (install scripts are off in web/.npmrc)
        working-directory: web
        run: npm ci
      - name: Unit tests (no network)
        run: python -m unittest discover -s tests -t . -v
      - name: Unit tests under python -O (no check may rely on assert)
        run: python -O -m unittest discover -s tests -t .

  # Same versions as the production server: Ubuntu 24.04, Python 3.12, cryptography 41.0.7
  # (the distribution package). Guards the lower bound of requirements.txt.
  server-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the server's cryptography version
        run: python -m pip install "cryptography==41.0.7"
      - name: Show versions
        run: python -c "import sys, cryptography; print(sys.version); print('cryptography', cryptography.__version__)"
      - name: Compile
        run: python -m py_compile room_census.py census_render.py flop_did.py durable.py manifest.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the staging tests run by the Python suite import the site's schema, which needs web/node_modules
      - name: Install the site's dependencies from the lockfile (install scripts are off in web/.npmrc)
        working-directory: web
        run: npm ci
      - name: Unit tests (no network)
        run: python -m unittest discover -s tests -t . -v
      - name: Unit tests under python -O (no check may rely on assert)
        run: python -O -m unittest discover -s tests -t .
