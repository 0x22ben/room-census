name: pages

# Publishes the Astro site under web/ to GitHub Pages, and nothing else. It runs only on main, so a
# branch can never change what the public site serves. The build is the same one the `web` workflow
# checks: the staging step, then `astro build`, then the route and artifact contract before the
# upload. If the contract fails, nothing is deployed and the site keeps serving the previous version.
#
# Rolling back does not need this workflow: setting the Pages source back to "branch main, path /"
# serves the pages that are still committed at the root of main, exactly as before the switch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and a running one is never cancelled half way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (the artifact tests read room_census.py constants)
        run: python -m pip install -r requirements.txt
      - name: Install from the lockfile (install scripts are off in web/.npmrc)
        working-directory: web
        run: npm ci
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Artifact tests
        run: python -m unittest tests.test_web
      - name: Route and artifact contract
        run: python tests/site_contract.py web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
